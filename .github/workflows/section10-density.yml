name: Section 10 density verification
"on":
  push:
    branches: ['codex/section10-complex-density']
    paths:
      - 'Section10/BernoulliSection10Complex/**'
      - 'Section10/BernoulliSection10Source/**'
      - 'Section10/BernoulliSection10Complex.lean'
      - 'Section10/BernoulliSection10Source.lean'
      - 'Section10/BernoulliSection10/HighBandClosure.lean'
      - 'Section10/BernoulliSection10/GaussianReferenceFacts.lean'
      - 'section3/**'
      - 'lakefile.toml'
      - '.github/workflows/section10-density.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section10-density-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-front:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and restore mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check front-end source scope
        run: |
          python3 scripts/check_axioms.py --self-test
          python3 scripts/check_placeholders.py --path Section10/BernoulliSection10Complex
          python3 scripts/check_placeholders.py --path Section10/BernoulliSection10Source
          python3 scripts/build_serial.py --target BernoulliSection10Complex.Front --dry-run
          python3 scripts/build_serial.py --target BernoulliSection10.HighBandClosure --target BernoulliSection10Complex.HighBandClosure --dry-run
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: .lake/build
          key: section10-density-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            section10-density-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            section10-density-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore previously verified common dependency cache
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: lean-section8-v1-ubuntu24-Linux-X64-0026f85b3cb0162890f706e8ff3b62ab296e1ba0eaa74f972b8781159c008d4d-24a1e37550a7e471bec4bb668ce4bde92fae3cbb-33677989986-1
      - name: Build actual planar front-end (not final Section 3 assembly)
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-section10
          {
            if lake --no-build build BernoulliSection10Complex.Front; then
              lake build BernoulliSection10Complex.Front
            else
              python3 scripts/build_serial.py --target BernoulliSection10Complex.Front --keep-going
            fi
          } 2>&1 | tee verification-section10/front-build.log
      - name: Inspect the upstream density record's actual quantifiers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          lake build BernoulliSection10Source.DensitySchemaAudit 2>&1 | tee verification-section10/density-schema.log
          lake env lean Section10/BernoulliSection10Source/DensitySchemaAudit.lean 2>&1 | tee -a verification-section10/density-schema.log
      - name: Build concrete Section 3 models and both LSV connections
        id: source
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          resume=()
          if [ -n '${{ steps.cache.outputs.cache-matched-key }}' ]; then
            # Omit repeated per-module invocations, not dependency checks:
            # every remaining build and the final targets use ordinary Lake validation.
            resume=(--start-at BernoulliSection10Source.IIDModels)
          fi
          python3 scripts/build_serial.py --target BernoulliSection10Source.PlanarHighBand --target BernoulliSection10Source.RealHighBand --target BernoulliSection10Source.FullBlockLogLimit --keep-going "${resume[@]}" 2>&1 | tee verification-section10/source-connection-build.log
      - name: Build conditional high-band closure for both density branches
        id: assembly
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          {
            if lake --no-build build BernoulliSection10.HighBandClosure BernoulliSection10Complex.HighBandClosure; then
              lake build BernoulliSection10.HighBandClosure BernoulliSection10Complex.HighBandClosure
            else
              resume=()
              if [ -n '${{ steps.cache.outputs.cache-matched-key }}' ]; then
                resume=(--start-at BernoulliSection10Complex.DensityCircularLaw)
              fi
              python3 scripts/build_serial.py --target BernoulliSection10.HighBandClosure --target BernoulliSection10Complex.HighBandClosure --keep-going "${resume[@]}"
            fi
          } 2>&1 | tee verification-section10/conditional-closure-build.log
      - name: Build source-connected caller-facing theorems
        id: connected
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.assembly.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          # Both prerequisite branches were checked in the preceding steps.
          # Normal Lake validation still covers their full dependency graph.
          lake build BernoulliSection10Source.DensityCircularLaw 2>&1 | tee verification-section10/connected-build.log
      - name: Complete repository build and default lake build
        id: full
        if: ${{ !cancelled() && steps.connected.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/build_serial.py --keep-going 2>&1 | tee verification-section10/full-build.log
          python3 scripts/check_placeholders.py 2>&1 | tee verification-section10/full-source-scan.log
      - name: Save checked artifacts for resumable verification
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Audit public planar front-end
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_axioms.py --audit-file Section10/BernoulliSection10Complex/AnalyticAxiomAudit.lean --audit-file Section10/BernoulliSection10Complex/FrontAxiomAudit.lean 2>&1 | tee verification-section10/front-axioms.log
          lake env lean Section10/BernoulliSection10Complex/FrontSignatureAudit.lean 2>&1 | tee verification-section10/front-signatures.log
      - name: Audit constructed source model and Gaussian reference
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_axioms.py --audit-file Section10/BernoulliSection10Complex/GaussianReferenceAxiomAudit.lean --audit-file Section10/BernoulliSection10Source/ModelAxiomAudit.lean 2>&1 | tee verification-section10/source-model-axioms.log
      - name: Audit conditional closure (not a final source-integration claim)
        if: ${{ !cancelled() && steps.assembly.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_axioms.py --audit-file Section10/BernoulliSection10Complex/ClosureAxiomAudit.lean 2>&1 | tee verification-section10/conditional-closure-axioms.log
      - name: Audit final source-connected signatures and axioms
        if: ${{ !cancelled() && steps.connected.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_axioms.py --audit-file Section10/BernoulliSection10Source/AxiomAudit.lean 2>&1 | tee verification-section10/connected-axioms-signatures.log
      - name: Full fresh repository axiom audit
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_axioms.py 2>&1 | tee verification-section10/full-axioms.log
          python3 scripts/check_axioms.py --audit-file section3/ShortRingAnchor/Audit.lean --audit-file section3/ShortRingAnchor/HighBandIntegrationAudit.lean 2>&1 | tee verification-section10/section3-upstream-axioms.log
      - name: Preserve build and audit logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section10-density-front-${{ github.sha }}
          path: verification-section10/
          retention-days: 30
