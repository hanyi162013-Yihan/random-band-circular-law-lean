name: Section 3 finite-moment and subgaussian high-band anchors
"on":
  push:
    paths:
      - 'section3/**'
      - '.github/workflows/section3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: section3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and restore mathlib (remote runner only)
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          lake-package-directory: section3
      - name: Source hygiene and audit-parser self-tests
        run: |
          node scripts/audit-lean-sources.mjs
          node scripts/verify-project.mjs --self-test
          node scripts/check-ginibre-pin.mjs
          node scripts/check-bc12-boundary.mjs
      - name: Check root and inherited workspace dependency resolution (no chapter builds)
        run: |
          mkdir -p ../.lake
          test ! -e ../.lake/packages
          ln -s ../section3/.lake/packages ../.lake/packages
          (cd .. && lake env lean --version)
          (cd ../section5 && lake env lean --version)
          (cd ../section6 && lake env lean --version)
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: |
            section3/.lake/build
            section3/.lake/packages/GinibreCorrelationIdentities/.lake/build
          key: section3-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('section3/lean-toolchain', 'section3/lake-manifest.json', 'section3/lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            section3-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('section3/lean-toolchain', 'section3/lake-manifest.json', 'section3/lakefile.toml') }}-
      - name: Serial import-closure build (Section 3 only)
        id: build
        run: node scripts/serial-upstream-build.mjs ShortRingAnchor.BC12.VerifiedAudit ShortRingAnchor.Audit ShortRingAnchor.HighBandIntegrationAudit ShortRingAnchor.Proposition38.Audit
      - name: Save completed artifacts for resumable verification
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            section3/.lake/build
            section3/.lake/packages/GinibreCorrelationIdentities/.lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Normal lake build and exact axiom audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-project.mjs
      - name: Preserve verification logs, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: section3-verification-${{ github.sha }}
          path: section3/audit/
          retention-days: 30
