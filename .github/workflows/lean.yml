name: General subgaussian Section 8
# Draft PR base codex/section8-bernoulli permits restoring its verified artifact cache.
"on":
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subgaussian-section8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check selected import scope and placeholders
        run: |
          python3 scripts/check_axioms.py --self-test
          python3 scripts/build_subgaussian.py --target SubgaussianSection8 --dry-run
          python3 scripts/check_placeholders.py --path SubgaussianSection8
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: |
            .lake/build
          key: subgaussian-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            subgaussian-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Restore verified baseline on extension cache miss
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: baseline_cache
        with:
          path: .lake/build
          key: lean-section8-v1-ubuntu24-Linux-X64-0026f85b3cb0162890f706e8ff3b62ab296e1ba0eaa74f972b8781159c008d4d-24a1e37550a7e471bec4bb668ce4bde92fae3cbb-33677989986-1
      - name: Scoped serial build
        id: build
        env:
          RESTORED_CACHE: ${{ steps.cache.outputs.cache-matched-key || steps.baseline_cache.outputs.cache-matched-key }}
        run: |
          if [ -n "$RESTORED_CACHE" ]; then
            python3 scripts/build_subgaussian.py --target SubgaussianSection8 --start-at SubgaussianSection8.Atom
          else
            python3 scripts/build_subgaussian.py --target SubgaussianSection8
          fi
      - name: Save completed build artifacts
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Audit this extension
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 scripts/check_axioms.py --audit-file SubgaussianSection8/AxiomAudit.lean
          lake env lean SubgaussianSection8/PublicSignatureAudit.lean
