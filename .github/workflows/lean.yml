name: Section 8 with proved Section 3 anchor
# Every build is restricted to the two Section 8 targets and their actual imports.
"on":
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subgaussian-section8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check selected import scope and placeholders
        run: |
          python3 scripts/check_axioms.py --self-test
          python3 scripts/build_subgaussian.py --target SubgaussianSection8 --target BernoulliSection8 --dry-run
          python3 scripts/check_placeholders.py --path SubgaussianSection8
          python3 scripts/check_placeholders.py --path Section8
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: |
            .lake/build
          key: section8-section3-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            section8-section3-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            subgaussian-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Restore proved Section 3 artifacts on integration cache miss
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: section3_cache
        with:
          path: section3/.lake/build
          key: section3-integration-seed-${{ github.run_id }}
          restore-keys: |
            section3-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('section3/lean-toolchain', 'section3/lake-manifest.json', 'section3/lakefile.toml') }}-
      - name: Reuse available Section 3 build products
        if: ${{ steps.section3_cache.outputs.cache-matched-key != '' }}
        run: |
          mkdir -p .lake/build
          cp -an section3/.lake/build/. .lake/build/
      - name: Scoped serial build
        id: build
        run: |
          python3 scripts/build_subgaussian.py --target SubgaussianSection8 --target BernoulliSection8
      - name: Save completed build artifacts
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Audit Section 8 and its concrete Section 3 adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 scripts/check_axioms.py --audit-file SubgaussianSection8/AxiomAudit.lean --audit-file Section8/AxiomAudit.lean --audit-file Section8/Section3IntegrationAudit.lean
          lake env lean SubgaussianSection8/PublicSignatureAudit.lean
          lake env lean Section8/PublicSignatureAudit.lean
