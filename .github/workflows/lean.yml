name: Section 8 with BC12-free Section 3 anchor
# Every build is restricted to the two Section 8 targets and their actual imports.
"on":
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subgaussian-section8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check selected import scope and placeholders
        run: |
          python3 scripts/check_axioms.py --self-test
          python3 scripts/build_subgaussian.py --target SubgaussianSection8 --target BernoulliSection8 --dry-run
          python3 scripts/check_placeholders.py --path SubgaussianSection8
          python3 scripts/check_placeholders.py --path Section8
          python3 scripts/check_section8_bc12_boundary.py
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: |
            .lake/build
            .lake/packages/GinibreCorrelationIdentities/.lake/build
          key: section8-bc12-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Lake validates source/dependency traces after restoring older library registrations.
          restore-keys: |
            section8-bc12-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            section8-bc12-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Seed common root artifacts from the existing main-branch cache
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: common_cache
        with:
          path: |
            .lake/build
            section5/.lake/build
          key: section8-common-seed-${{ github.run_id }}
          restore-keys: |
            section5-${{ runner.os }}-${{ runner.arch }}-
      - name: Scoped serial build
        id: build
        env:
          RESTORED_BUILD: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -o pipefail
          mkdir -p outputs/section8-bc12
          if [ -n "$RESTORED_BUILD" ]; then
            python3 scripts/build_subgaussian.py --target SubgaussianSection8 --target BernoulliSection8 \
              --module BernoulliSection8.Section3Gaussian \
              --module BernoulliSection8.Section3Model \
              --module BernoulliSection8.Section3GaussianLaw \
              --module BernoulliSection8.Section3Integration \
              --module SubgaussianSection8.Section3Integration \
              --module SubgaussianSection8.Results \
              --module BernoulliSection8.Section8Results 2>&1 | tee outputs/section8-bc12/build.log
          else
            python3 scripts/build_subgaussian.py --target SubgaussianSection8 --target BernoulliSection8 2>&1 | tee outputs/section8-bc12/build.log
          fi
      - name: Save completed build artifacts
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            .lake/packages/GinibreCorrelationIdentities/.lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Audit Section 8 and its concrete Section 3 adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 scripts/check_axioms.py --audit-file SubgaussianSection8/AxiomAudit.lean --audit-file Section8/AxiomAudit.lean --audit-file Section8/Section3IntegrationAudit.lean 2>&1 | tee outputs/section8-bc12/axioms.log
          lake env lean SubgaussianSection8/PublicSignatureAudit.lean 2>&1 | tee outputs/section8-bc12/subgaussian-signatures.log
          lake env lean Section8/PublicSignatureAudit.lean 2>&1 | tee outputs/section8-bc12/bernoulli-signatures.log
          git rev-parse HEAD | tee outputs/section8-bc12/verified-commit.txt
      - name: Preserve build, axiom and public-signature reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section8-bc12-${{ github.sha }}
          path: outputs/section8-bc12/
          if-no-files-found: ignore
          retention-days: 30
