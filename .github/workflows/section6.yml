name: Section 6 verification

on:
  push:
    paths:
      - "section6/**"
      - "section5/**"
      - "section3/**"
      - "lakefile.toml"
      - ".github/workflows/section6.yml"
  pull_request:
    paths:
      - "section6/**"
      - "section5/**"
      - "section3/**"
      - "lakefile.toml"
      - ".github/workflows/section6.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-section6:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
      SECTION5_INTERFACE_ONLY: ${{ contains(github.event.head_commit.message, '[section5-interface]') }}
      DENSE_INTERFACE_ONLY: ${{ contains(github.event.head_commit.message, '[section6-dense]') }}
      BBV_INTERFACE_ONLY: ${{ contains(github.event.head_commit.message, '[section6-bbv]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check for placeholder proofs
        run: >-
          python3 scripts/check_placeholders.py
          --path-prefix section6/
          --path-prefix section5/CircularLawSections56/Section5/PublishedSection3
          --path-prefix section3/ShortRingAnchor/AtomAssumption21.lean
          --path-prefix section3/ShortRingAnchor/BC12/GinibreSmallBall.lean
          --path-prefix section3/ShortRingAnchor/BC12/GinibreNegativeMoments.lean
          --path-prefix section3/Vendor/Arxiv2410/V3/FreeDysonUniqueness.lean
      - name: Restore project build caches
        id: project_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .lake/build
            section5/.lake/build
            section6/.lake/build
          key: section6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'section5/lakefile.toml', 'section5/lake-manifest.json', 'section6/lakefile.toml', 'section6/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            section6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'section5/lakefile.toml', 'section5/lake-manifest.json', 'section6/lakefile.toml', 'section6/lake-manifest.json') }}-
            section6-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Lean and shared mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Compile the Section 6 continuation and audit its axioms
        id: section6_build
        working-directory: section6
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-ci
          if [[ "$SECTION5_INTERFACE_ONLY" == "true" ]]; then
            lake --no-cache build CircularLawSections56.Section5.PublishedSection3ConcreteEndpoint CircularLawSection6.PublishedConcreteGaussianProfile 2>&1 | tee verification-ci/build.log
            lake --no-cache env lean -DwarningAsError=true ../section5/PublishedSection3ConcreteAudit.lean 2>&1 | tee verification-ci/axioms.log
            lake --no-cache env lean -DwarningAsError=true PublishedConcreteAudit.lean 2>&1 | tee verification-ci/concrete-section6.log
          elif [[ "$DENSE_INTERFACE_ONLY" == "true" ]]; then
            lake --no-cache build CircularLawSection6.GinibreFiniteFormulaSources 2>&1 | tee verification-ci/build.log
            lake --no-cache env lean -DwarningAsError=true DenseGinibreAudit.lean 2>&1 | tee verification-ci/axioms.log
          elif [[ "$BBV_INTERFACE_ONLY" == "true" ]]; then
            lake --no-cache build CircularLawSection6.GinibreDysonImaginary CircularLawSection6.UnequalGinibreCutoff 2>&1 | tee verification-ci/build.log
            lake --no-cache env lean -DwarningAsError=true BBVGinibreAudit.lean 2>&1 | tee verification-ci/axioms.log
          else
            lake --no-cache build CircularLawSection6 2>&1 | tee verification-ci/build.log
            lake --no-cache env lean -DwarningAsError=true AxiomAudit.lean 2>&1 | tee verification-ci/axioms.log
            lake --no-cache env lean -DwarningAsError=true Regression.lean 2>&1 | tee verification-ci/regression.log
          fi
      # Failed new modules must not discard already-built Section 4/5 dependencies.
      # Lake still validates source hashes; saving this cache does not change the job result.
      - name: Preserve completed dependency builds
        if: ${{ !cancelled() && steps.project_cache.outputs.cache-hit != 'true' && (steps.section6_build.outcome == 'success' || steps.section6_build.outcome == 'failure') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .lake/build
            section5/.lake/build
            section6/.lake/build
          key: ${{ steps.project_cache.outputs.cache-primary-key }}
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: section6-verification-${{ github.run_id }}
          path: section6/verification-ci/*.log
          if-no-files-found: ignore
          retention-days: 7
